<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout | PEGASUS WEAR</title>

    <link
        rel="stylesheet"
        href="assets/css/main.css"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER for peagassus
    ====================================================== -->

    <header class="header">

        <div class="container header-container">

            <a
                href="index.html"
                class="logo"
            >
                PEGASUS
            </a>


            <nav class="nav">

                <ul class="nav-list">

                    <li>
                        <a href="index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="shop.html">
                            Shop
                        </a>
                    </li>

                    <li>
                        <a href="index.html#universe">
                            Universe
                        </a>
                    </li>

                    <li>
                        <a href="index.html#contact">
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>


            <div class="header-icons">

                <a
                    href="shop.html"
                    class="header-icon"
                    aria-label="Back to shop"
                >
                    <i class="fa-solid fa-bag-shopping"></i>
                </a>

            </div>

        </div>

    </header>



    <!-- =====================================================
         CHECKOUT
    ====================================================== -->

    <main>

        <section class="checkout section">

            <div class="container">

                <div class="checkout-title">

                    <span class="section-eyebrow">
                        PEGASUS WEAR
                    </span>

                    <h1>
                        CHECKOUT
                    </h1>

                    <p>
                        Complete your order.
                    </p>

                </div>


                <div class="checkout-layout">


                    <!-- =====================================
                         CUSTOMER INFORMATION
                    ====================================== -->

                    <div class="checkout-form">

                        <div class="checkout-card">

                            <h2>
                                Customer Information
                            </h2>


                            <div class="form-row">

                                <div class="form-group">

                                    <label for="first-name">
                                        First Name
                                    </label>

                                    <input
                                        type="text"
                                        id="first-name"
                                        placeholder="Ahmed"
                                        required
                                    >

                                </div>


                                <div class="form-group">

                                    <label for="last-name">
                                        Last Name
                                    </label>

                                    <input
                                        type="text"
                                        id="last-name"
                                        placeholder="Eltahawy"
                                        required
                                    >

                                </div>

                            </div>


                            <div class="form-group">

                                <label for="email">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    placeholder="you@example.com"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="phone">
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    id="phone"
                                    placeholder="01XXXXXXXXX"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="address">
                                    Address
                                </label>

                                <input
                                    type="text"
                                    id="address"
                                    placeholder="Street / Building / Apartment"
                                    required
                                >

                            </div>


                            <div class="form-row">

                                <div class="form-group">

                                    <label for="city">
                                        City
                                    </label>

                                    <input
                                        type="text"
                                        id="city"
                                        placeholder="Beni Suef"
                                        required
                                    >

                                </div>


                                <div class="form-group">

                                    <label for="area">
                                        Area
                                    </label>

                                    <input
                                        type="text"
                                        id="area"
                                        placeholder="Your Area"
                                        required
                                    >

                                </div>

                            </div>

                        </div>



                        <!-- =================================
                             PAYMENT
                        ================================== -->

                        <div class="checkout-card">

                            <h2>
                                Payment Method
                            </h2>


                            <label class="payment-option">

                                <input
                                    type="radio"
                                    name="payment"
                                    value="cod"
                                    checked
                                >

                                <span>

                                    <strong>
                                        Cash on Delivery
                                    </strong>

                                    <small>
                                        Pay when your order arrives.
                                    </small>

                                </span>

                            </label>


                            <label class="payment-option">

                                <input
                                    type="radio"
                                    name="payment"
                                    value="card"
                                >

                                <span>

                                    <strong>
                                        Card
                                    </strong>

                                    <small>
                                        Card payment will be available soon.
                                    </small>

                                </span>

                            </label>

                        </div>

                    </div>



                    <!-- =====================================
                         ORDER SUMMARY
                    ====================================== -->

                    <aside class="checkout-summary">

                        <div class="checkout-card">

                            <h2>
                                Your Order
                            </h2>


                            <div
                                id="checkout-items"
                                class="checkout-items"
                            >

                                <p class="empty-checkout">
                                    Your cart is empty.
                                </p>

                            </div>


                            <div class="checkout-summary-line">

                                <span>
                                    Subtotal
                                </span>

                                <strong id="checkout-subtotal">
                                    0 EGP
                                </strong>

                            </div>


                            <div class="checkout-summary-line">

                                <span>
                                    Shipping
                                </span>

                                <strong id="checkout-shipping">
                                    50 EGP
                                </strong>

                            </div>


                            <div class="checkout-summary-total">

                                <span>
                                    Total
                                </span>

                                <strong id="checkout-total">
                                    0 EGP
                                </strong>

                            </div>


                            <button
                                type="button"
                                id="place-order"
                                class="btn btn-primary checkout-submit"
                            >
                                PLACE ORDER
                            </button>

                        </div>

                    </aside>


                </div>

            </div>

        </section>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">

        <div class="container footer-bottom">

            <p>
                © 2026 PEGASUS WEAR |
                All Rights Reserved
            </p>

        </div>

    </footer>



    <script src="assets/js/app.js"></script>

</body>

</html>
