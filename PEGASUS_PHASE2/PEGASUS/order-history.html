<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order History | PEGASUS WEAR</title>

    <link
        rel="stylesheet"
        href="assets/css/main.css"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="container header-container">

            <a
                href="index.html"
                class="logo"
            >
                PEGASUS
            </a>


            <nav class="nav">

                <ul class="nav-list">

                    <li>
                        <a href="index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="shop.html">
                            Shop
                        </a>
                    </li>

                    <li>
                        <a href="index.html#universe">
                            Universe
                        </a>
                    </li>

                    <li>
                        <a href="index.html#contact">
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>


            <div class="header-icons">

                <a
                    href="shop.html"
                    class="header-icon"
                    aria-label="Back to shop"
                >
                    <i class="fa-solid fa-bag-shopping"></i>
                </a>

            </div>

        </div>

    </header>



    <!-- =====================================================
         ORDER HISTORY
    ====================================================== -->

    <main>

        <section class="checkout section">

            <div class="container">


                <!-- =========================================
                     PAGE TITLE
                ========================================== -->

                <div class="checkout-title">

                    <span class="section-eyebrow">
                        PEGASUS WEAR
                    </span>

                    <h1>
                        ORDER HISTORY
                    </h1>

                    <p>
                        View your previous orders.
                    </p>

                </div>



                <!-- =========================================
                     ORDERS CONTAINER
                ========================================== -->

                <div
                    id="order-history"
                    class="order-history"
                >
                </div>



                <!-- =========================================
                     EMPTY STATE
                ========================================== -->

                <div
                    id="empty-orders"
                    class="checkout-card"
                    style="display: none;"
                >

                    <div class="order-success">

                        <div class="order-success-icon">
                            <i class="fa-solid fa-box-open"></i>
                        </div>


                        <h2>
                            NO ORDERS YET
                        </h2>


                        <p>
                            You haven't placed any orders yet.
                        </p>


                        <a
                            href="shop.html"
                            class="btn btn-primary"
                        >
                            START SHOPPING
                        </a>

                    </div>

                </div>


            </div>

        </section>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">

        <div class="container footer-bottom">

            <p>
                © 2026 PEGASUS WEAR |
                All Rights Reserved
            </p>

        </div>

    </footer>



    <!-- =====================================================
         ORDER HISTORY JS
    ====================================================== -->

    <script>

        /* =====================================================
           GET ORDERS
        ====================================================== */

        const orderHistoryContainer =
            document.getElementById(
                "order-history"
            );


        const emptyOrders =
            document.getElementById(
                "empty-orders"
            );


        const savedOrders =
            JSON.parse(
                localStorage.getItem(
                    "pegasusOrders"
                )
            ) || [];


        /* =====================================================
           VALIDATE ORDERS
        ====================================================== */

        if (
            !Array.isArray(savedOrders) ||
            savedOrders.length === 0
        ) {

            if (emptyOrders) {

                emptyOrders.style.display =
                    "block";

            }

        } else {


            /* =================================================
               SHOW ORDERS
            ================================================= */

            const orders =
                [...savedOrders].reverse();


            orders.forEach((order) => {


                /* =============================================
                   ORDER DATA
                ============================================== */

                const orderId =
                    order.id || "—";


                const customerName =
                    `${order.customer?.firstName || ""} ${order.customer?.lastName || ""}`
                        .trim() || "Customer";


                const payment =
                    order.payment === "cod"
                        ? "Cash on Delivery"
                        : "Card";


                const status =
                    order.status || "pending";


                const statusText =
                    status.charAt(0).toUpperCase() +
                    status.slice(1);


                const subtotal =
                    Number(order.subtotal) || 0;


                const shipping =
                    Number(order.shipping) || 0;


                const total =
                    Number(order.total) ||
                    subtotal + shipping;


                const products =
                    Array.isArray(order.products)
                        ? order.products
                        : [];


                const productCount =
                    products.reduce(
                        (sum, item) =>
                            sum +
                            (Number(item.quantity) || 1),
                        0
                    );


                let formattedDate =
                    "—";


                if (order.date) {

                    formattedDate =
                        new Date(
                            order.date
                        ).toLocaleString(
                            "en-GB",
                            {
                                day: "2-digit",
                                month: "short",
                                year: "numeric",
                                hour: "2-digit",
                                minute: "2-digit"
                            }
                        );

                }


                /* =============================================
                   ORDER CARD
                ============================================== */

                const orderCard =
                    document.createElement("div");


                orderCard.className =
                    "checkout-card order-card";


                orderCard.innerHTML = `

                    <div class="order-card-header">

                        <div>

                            <span class="section-eyebrow">
                                ORDER
                            </span>

                            <h2>
                                ${orderId}
                            </h2>

                        </div>


                        <span
                            class="order-status order-status-${status}"
                        >
                            ${statusText}
                        </span>

                    </div>


                    <div class="order-card-info">

                        <div>

                            <span>
                                Date
                            </span>

                            <strong>
                                ${formattedDate}
                            </strong>

                        </div>


                        <div>

                            <span>
                                Customer
                            </span>

                            <strong>
                                ${customerName}
                            </strong>

                        </div>


                        <div>

                            <span>
                                Products
                            </span>

                            <strong>
                                ${productCount}
                            </strong>

                        </div>


                        <div>

                            <span>
                                Payment
                            </span>

                            <strong>
                                ${payment}
                            </strong>

                        </div>

                    </div>


                    <div class="order-card-total">

                        <span>
                            Total
                        </span>

                        <strong>
                            ${total} EGP
                        </strong>

                    </div>


                    <div class="order-card-actions">

                        <button
                            type="button"
                            class="btn btn-primary view-order"
                        >
                            VIEW ORDER
                        </button>

                    </div>

                `;


                /* =============================================
                   VIEW ORDER
                ============================================== */

                const viewOrderButton =
                    orderCard.querySelector(
                        ".view-order"
                    );


                if (viewOrderButton) {

                    viewOrderButton.addEventListener(
                        "click",
                        () => {

                            localStorage.setItem(
                                "pegasusSelectedOrder",
                                JSON.stringify(order)
                            );


                            window.location.href =
                                "order-confirmation.html";

                        }
                    );

                }


                orderHistoryContainer.appendChild(
                    orderCard
                );

            });

        }

    </script>


</body>

</html>
